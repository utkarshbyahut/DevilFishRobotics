
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; This project builds firmware for THREE separate microcontrollers. Each
; controller has its own [env:...] section and its own source folder under
; src/. The build_src_filter ensures each environment only compiles the code
; in its matching folder (plus any shared code in src/common).
;
;   1. Ground_Com  - ESP32 topside. Talks to Float_Cont over ESP-NOW.
;   2. Float_Cont  - Handles comms + desired-depth calc, data storage and
;                    rebroadcast. ESP-NOW link to Ground_Com, UART to Motor_Cont.
;   3. Motor_Cont  - Receives desired position from Float_Cont over UART and
;                    drives a motor to that position.
;
; Build/upload a single controller, e.g.:
;   pio run -e Ground_Com -t upload
;   pio run -e Float_Cont -t upload
;   pio run -e Motor_Cont -t upload

[env]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200

; Shared message structs live in include/messages.h (auto-added to the build
; path for every env). Per-env source folders are selected below so each
; controller only compiles its own main.cpp.

[env:Ground_Com]
build_src_filter = +<Ground_Com/>

[env:Float_Cont]
build_src_filter = +<Float_Cont/>

[env:Motor_Cont]
build_src_filter = +<Motor_Cont/>

