<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float Dashboard</title>

    <!-- Tailwind CSS for quick styling -->
    <link href="tailwind.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link rel="icon" href="resources/Desert_Stars.png">

    <!-- Graphing Java script -->
    <script src='https://cdn.plot.ly/plotly-2.30.0.min.js'></script>
</head>

<!-- Body of the HTML page -->
<body>
    <!-- Top Navigation Bar for the Dashboard -->
    <div>
        <nav class="bg-gray-300 border-gray-200"> <!-- Set Border and background colors -->
            <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4"><!-- Set max width and padding sets as flex -->
                
                <a class="flex items-center space-x-3">
                    <img src="resources/Desert_Stars.png" class="h-12" alt="Desert Star Robotics Logo" />
                    <span class="self-center text-2xl font-semibold whitespace-nowrap dark:text-white">Float Dashboard</span>
                </a>

                <!-- Navigation Links for the Dashboard -->
                <div class="block w-auto">
                            <button id="connectSerial" class="p-2 bg-blue-500 text-white rounded">Connect</button>
                            <button id="disconnectSerial" class="p-2 bg-red-500 text-white rounded hidden">Disconnect</button>
                            <span id="statusIndicator" class="ml-5 h-12 w-10 px-2.5 status-red"></span>
                </div>
            </div>
        </nav>
    </div>

    <div class="container mx-auto p-8">
        <!-- Top Row for Control Buttons -->
        <div class="grid grid-cols-3 gap-4 mb-8">
            <!-- Empty Div for Aesthetics or Additional Controls -->
            <div class="flex flex-col items-center p-4 border rounded">
                <div>
                    <div class="flex justify-between">
                        <h3 class="text-2xl font-bold text-gray-500">Status</h3>
                        <button id="statusRequest" class="p-2 bg-purple-500 text-white rounded px-6">Request Update</button>
                    </div>
                    <table class="table-auto">
                        <thead>
                            <tr>
                                <th class="px-4 py-2">Team</th>
                                <th class="px-4 py-2">Depth</th>
                                <th class="px-4 py-2">Pressure</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="border px-4 py-2" id="teamStatus"><pre>    </pre></td>
                                <td class="border px-4 py-2" id="depthStatus"><pre>    </pre></td>
                                <td class="border px-4 py-2" id="pressureStatus"><pre>    </pre></td>
                            </tr>
                        </tbody>
                        <thead>
                            <th class="px-4 py-2">Temp.</th>
                            <th class="px-4 py-2">Battery</th>
                            <th class="px-4 py-2">Time</th>
                        </thead>
                        <tbody>
                            <td class="border px-4 py-2" id="temperatureStatus"><pre>    </pre></td>
                            <td class="border px-4 py-2" id="batteryStatus"></td>
                            <td class="border px-4 py-2 "id="timeStatus"></td>
                        </tbody>
                    </table>
                    <h3 class="text-2xl font-bold text-gray-500 py-2">Controls</h3>
                    <table class="table-auto">
                        <tbody>
                            <tr>
                                <td class="border px-4 py-2 text-center">
                                    <div class="bg-pink-500 p-2 rounded">
                                        <button id="setNameRequest" class=" text-white rounded">Set Name</button>
                                        <input id="newName" type="text" class="p-0 border w-12 bg-pink-100 text-gray-500 rounded" placeholder="PNXX" 
                                        onchange="localStorage.teamName = this.value"/>
                                    </div>
                                </td>
                                <td class="border px-4 py-2 text-center">
                                    <button id="calibrateRequest" class="p-2 status-red text-white rounded">Calibrate</button>
                                </td>
                                <td class="border px-4 py-2 text-center">
                                    <button id="timeRequest" class="p-2 bg-blue-500 text-white rounded">Update Time</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <h3 class="text-2xl font-bold text-gray-500 py-2">Buoyancy Engine Controls</h3>
                    <table class="table-auto">
                        <tbody>
                            <tr>
                                <td class="border px-4 py-2 text-center">
                                    <button id="upRequest" class="p-2 bg-green-500 text-white rounded">Up</button>
                                </td>
                                <td class="border px-4 py-2 text-center">
                                    <button id="neutralRequest" class="p-2 bg-yellow-500 text-white rounded">Neutral</button>
                                </td>
                                <td class="border px-4 py-2 text-center">
                                    <button id="downRequest" class="p-2 bg-red-500 text-white rounded">Down</button>
                                </td>
                                <td class="border px-4 py-2 text-center">
                                    <input id="manualNumber" type="number" class="p-2 border w-16 rounded" placeholder="50" min="0" max="100" step="25" />
                                    <button class="p-2 bg-blue-500 text-white rounded" id="manualRequest">Man.</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <h3 class="text-2xl font-bold text-gray-500 ">Profile Controls</h3>
                    <table class="table-auto">
                        <tbody>
                            <tr>
                                <td class="border px-4 py-2 text-center">
                                    <button id="profileRequest" class="p-2 bg-green-500 text-white rounded">Profile</button>
                                </td>
                                <td class="border px-4 py-2 text-center">
                                    <button id="dataRequest" class="p-2 bg-pink-500 text-white rounded">Send Data</button>
                                </td>
                                <td class="border px-4 py-2 text-center">
                                    <button id="clearDataRequest" class="p-2 bg-green-500 text-white rounded">Clear Data</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Graph Container -->
            <div class="col-span-1 lg:col-span-2 p-4 border rounded">
                <h1 class="text-2xl font-bold mb-0 text-gray-500">Depth Data</h1>
                <div id="dataGraph"></div>
                <div class="flex justify-between mt-4">
                    <button class="p-2 bg-purple-500 text-white rounded ml-2" id="DownloadCSV">Download CSV</button>
                    <button class="p-2 bg-blue-500 text-white rounded ml-2" id="ClearGraph">Clear Graph</button>
                    <button class="p-2 bg-pink-700 text-white rounded ml-2" id="ClearAll">Clear Graph & Float Data</button>
                </div>
            </div>
        </div>

        <!-- Bottom Row for Serial Terminal -->
        <div class="border rounded p-4">
            <div class="flex justify-between">
                <h1 class="text-2xl font-bold mb-4 text-gray-500">Serial Terminal</h1>
                <button class="p-2 bg-blue-500 text-white rounded mb-4" id="downloadTerminal">Download .txt</button>
            </div>
            <textarea id="terminal" class="w-full p-2 border rounded" rows="10" readonly></textarea>
            <div class="flex mt-2">
                <input id="inputSerial" class="w-full p-2 border rounded" placeholder="Type your command here" />
                <button id="sendSerial" class="p-2 px-4 bg-yellow-500 text-white rounded ml-2">Send</button>
                <button class="p-2 bg-green-500 text-white rounded ml-2" id="ClearTerminal">Clear</button>
            </div>
        </div>
    </div>

    <!-- Scripts for Serial API, Chart, and Event Listeners will be added here -->
    <script src="javaScript/graph.js"></script>
    <script src="javaScript/serial.js"></script>
    <script src="javaScript/downloads.js"></script>
    <script src="javaScript/listeners.js"></script>
</body>
</html>
